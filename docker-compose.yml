services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
      PORT: 5000
    ports:
      - "127.0.0.1:5000:5000"
    restart: unless-stopped
    networks:
      - app-network

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - app-network

  openwa:
    image: rmyndharis/openwa:latest
    ports:
      - "127.0.0.1:2785:2785"
    environment:
      PORT: 2785
      NODE_ENV: production
      DATABASE_TYPE: sqlite
      DATABASE_NAME: /app/data/openwa.sqlite
      DATABASE_SYNCHRONIZE: "true"
      ENGINE_TYPE: whatsapp-web.js
      SESSION_DATA_PATH: /app/data/sessions
      PUPPETEER_HEADLESS: "true"
      AUTO_START_SESSIONS: "true"
    volumes:
      - openwa-data:/app/data
    restart: unless-stopped
    networks:
      - app-network

volumes:
  openwa-data:

networks:
  app-network:
    driver: bridge
