# ==============================================
# Courier Service + OpenWA WhatsApp Gateway
# Single deployment with Docker Compose
# ==============================================
# Usage:
#   docker compose up -d          (start both services)
#   docker compose logs -f        (view logs)
#   docker compose down           (stop everything)
# ==============================================

version: '3.8'

services:
  # Your Courier Service App (Express + React)
  courier-app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=${MONGO_URI}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - openwa
    restart: unless-stopped
    networks:
      - app-network

  # OpenWA WhatsApp Gateway (free, self-hosted)
  openwa:
    image: rmyndharis/openwa:latest
    ports:
      - "2785:2785"
    environment:
      - PORT=2785
      - NODE_ENV=production
      - DATABASE_TYPE=sqlite
      - DATABASE_NAME=/data/openwa.sqlite
      - DATABASE_SYNCHRONIZE=true
      - ENGINE_TYPE=whatsapp-web.js
      - SESSION_DATA_PATH=/data/sessions
      - PUPPETEER_HEADLESS=true
      - AUTO_START_SESSIONS=true
    volumes:
      - openwa-data:/data
    restart: unless-stopped
    networks:
      - app-network

volumes:
  openwa-data:

networks:
  app-network:
    driver: bridge
