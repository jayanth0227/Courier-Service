<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="FastTrack Logistics - Professional Parcel & Bus Dispatch Management System" />
    <title>FastTrack Logistics - Parcel & Bus Dispatch System</title>
    <style>
      /* Prevent any scrollbar flashing during page load */
      html, body, #root, * {
        scrollbar-width: none !important;
        -ms-overflow-style: none !important;
      }
      *::-webkit-scrollbar {
        display: none !important;
        width: 0 !important;
        height: 0 !important;
      }
    </style>
    <script>
      /* Early protection guard before bundle hydration */
      (function() {
        document.addEventListener('contextmenu', function(e) { e.preventDefault(); }, { capture: true });
        window.addEventListener('keydown', function(e) {
          var k = e.key ? e.key.toUpperCase() : '';
          var code = e.keyCode || e.which;
          var ctrl = e.ctrlKey || e.metaKey;
          if (k === 'F12' || code === 123) { e.preventDefault(); return false; }
          if (ctrl && e.shiftKey && (k === 'I' || k === 'J' || k === 'C' || k === 'K' || k === 'E')) { e.preventDefault(); return false; }
          if (ctrl && (k === 'U' || k === 'S')) { e.preventDefault(); return false; }
        }, { capture: true });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
